# Blueprint สำหรับ Render — https://render.com/docs/blueprint-spec
#
# ฐานข้อมูลใช้ Neon (คนละเจ้ากับ Render) จึงไม่ประกาศ databases: ไว้ที่นี่
# ให้ไปสร้างที่ neon.tech แล้วเอา connection string มาใส่เป็น DATABASE_URL
#
# ค่าที่ตั้ง sync: false = Render จะถามตอน deploy ครั้งแรก และไม่เก็บลง git
# ห้ามใส่ค่าจริงของ secret ลงไฟล์นี้เด็ดขาด เพราะไฟล์นี้ขึ้น git

services:
  - type: web
    name: follow-up
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production

      # Neon: Dashboard > Connection string (เลือกแบบ pooled)
      # asyncpg ไม่รู้จัก ?sslmode= แต่แอปถอดให้เองใน app/db.py แล้ว วางมาทั้งเส้นได้เลย
      - key: DATABASE_URL
        sync: false

      # ต้องตรงกับโดเมนที่ Render ออกให้ และตรงกับ OAuth App บน GitHub เป๊ะ ๆ
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Render สุ่มให้เอง ไม่ต้องคิดเองและไม่มีใครเห็นค่า
      - key: SESSION_SECRET
        generateValue: true
      # ใช้เข้ารหัส github_token ที่เก็บในฐานข้อมูล
      - key: TOKEN_SECRET
        generateValue: true

      # โหมดทดสอบต้องปิดบน production
      - key: AI_MOCK
        value: "false"
      - key: AUTH_MOCK
        value: "false"

      # โดเมนเดียวกับ frontend อยู่แล้ว ไม่ต้องเปิด CORS ให้ใคร
      - key: CORS_ORIGIN
        sync: false
