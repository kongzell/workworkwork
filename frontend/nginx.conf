server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ส่งต่อ /api ไปที่ backend (ชื่อ service ใน compose คือ api)
    location /api/ {
        proxy_pass         http://api:3000;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # asset ของ vite มี hash ในชื่อไฟล์อยู่แล้ว -> cache ยาวได้
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ชี้ไปที่บันเดิลชื่อใหม่ทุกครั้งที่ build
        # ถ้าปล่อยให้ cache เบราว์เซอร์จะโหลดโค้ดเก่าค้างไว้ตลอด
        add_header Cache-Control "no-cache" always;
    }
}
